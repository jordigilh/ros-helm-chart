apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cost-onprem.fullname" . }}-kessel-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cost-onprem.koku.labels" . | nindent 4 }}
    app.kubernetes.io/component: kessel-provision
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "cost-onprem.koku.labels" . | nindent 8 }}
        app.kubernetes.io/component: kessel-provision
    spec:
      serviceAccountName: {{ include "cost-onprem.koku.serviceAccountName" . }}
      restartPolicy: OnFailure

      securityContext:
        {{- include "cost-onprem.securityContext.pod" . | nindent 8 }}

      containers:
      - name: kessel-provision
        image: "{{ include "cost-onprem.koku.image" . }}"
        imagePullPolicy: {{ .Values.costManagement.api.image.pullPolicy }}
        command:
          - bash
          - -c
          - |
            set -e
            echo "=== Kessel Provision Job ==="
            echo "Timestamp: $(date)"
            echo "Release: {{ .Release.Name }}"

            mkdir -p /tmp/prometheus
            cd /opt/koku/koku

            echo "Step 1/2: Writing ZED schema to SpiceDB..."
            python manage.py kessel_update_schema --force
            echo "✓ Schema written"

            echo "Step 2/2: Seeding standard Cost Management roles..."
            python manage.py kessel_seed_roles
            echo "✓ Roles seeded"

            echo "=== Kessel provision job completed ==="

        env:
        {{- include "cost-onprem.koku.commonEnv" . | nindent 8 }}

        volumeMounts:
        {{- include "cost-onprem.koku.volumeMounts" . | nindent 8 }}

        securityContext:
          {{- include "cost-onprem.securityContext.container" . | nindent 10 }}

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi

      initContainers:
      {{- include "cost-onprem.koku.initContainer.combineCA" . | nindent 6 }}

      volumes:
      {{- include "cost-onprem.koku.volumes" . | nindent 6 }}
